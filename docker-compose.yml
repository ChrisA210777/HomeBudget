# Local development dependencies. Start with: docker compose up -d
# The password below is for local development only and matches appsettings.Development.json.
services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: homebudget-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "HomeBudget_Dev_Pa55!"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - homebudget-sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  homebudget-sql-data:
