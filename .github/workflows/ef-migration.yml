name: Add EF Core migration

# Generates an EF Core migration and commits it to the chosen branch.
# Run it from the Actions tab: pick the branch with your model changes and enter a migration name.
on:
  workflow_dispatch:
    inputs:
      name:
        description: Migration name in PascalCase, e.g. AddHouseholds
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: ef-migration-${{ github.ref }}

jobs:
  add-migration:
    runs-on: ubuntu-latest
    env:
      MIGRATION_NAME: ${{ inputs.name }}
      MIGRATIONS_DIR: src/Budget.Infrastructure/Persistence/Migrations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate migration name
        run: |
          if [[ ! "$MIGRATION_NAME" =~ ^[A-Z][A-Za-z0-9]*$ ]]; then
            echo "::error::Migration name must be PascalCase letters and digits, e.g. AddHouseholds"
            exit 1
          fi

      - name: Check whether the migration already exists
        id: existing
        run: |
          if compgen -G "$MIGRATIONS_DIR/*_${MIGRATION_NAME}.cs" > /dev/null; then
            echo "Migration $MIGRATION_NAME already exists; nothing to do."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        if: steps.existing.outputs.exists != 'true'
        with:
          global-json-file: global.json

      - name: Add migration
        if: steps.existing.outputs.exists != 'true'
        run: |
          # dotnet-ef reads project metadata before building, so packages must be restored first.
          dotnet restore HomeBudget.slnx
          dotnet tool restore
          dotnet ef migrations add "$MIGRATION_NAME" \
            --project src/Budget.Infrastructure \
            --startup-project src/Budget.Server \
            --output-dir Persistence/Migrations

      - name: Commit migration
        if: steps.existing.outputs.exists != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$MIGRATIONS_DIR"
          git commit -m "Add EF Core migration $MIGRATION_NAME"
          git push
