name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      print_screens:
        description: Print E2E screenshots into the log (for reviewing without downloading artifacts)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Check the Azure templates
        run: |
          az bicep install
          az bicep build --file infra/main.bicep --stdout > /dev/null 2> bicep.log || true
          az bicep build-params --file infra/dev.bicepparam --stdout > /dev/null 2>> bicep.log || true
          cat bicep.log
          if grep -Eq "Warning|Error" bicep.log; then echo "::error::Fix the Bicep warnings above"; exit 1; fi

      - name: Restore
        run: dotnet restore HomeBudget.slnx

      - name: Build
        run: dotnet build HomeBudget.slnx --no-restore --configuration Release

      - name: Test
        run: >
          dotnet test HomeBudget.slnx --no-build --configuration Release
          --logger trx --results-directory TestResults
          --collect:"XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: TestResults

      # A self-contained executable that applies EF Core migrations. The deployment pipeline
      # (BUD-11) runs it against each environment's database: ./efbundle --connection "<conn>"
      - name: Build migration bundle
        run: |
          dotnet tool restore
          dotnet ef migrations bundle \
            --project src/Budget.Infrastructure \
            --startup-project src/Budget.Server \
            --configuration Release \
            --self-contained --target-runtime linux-x64 \
            --output artifacts/efbundle --force

      - name: Upload migration bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: efbundle
          path: artifacts/efbundle

  # End-to-end and accessibility tests (BUD-40): publish the app, run it in the Testing
  # environment against a throwaway SQL Server, and drive it with Playwright.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      sql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "E2e_Only_Pa55!"
          MSSQL_PID: Developer
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'E2e_Only_Pa55!' -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
    env:
      E2E_BASE_URL: https://localhost:7180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Publish the app
        run: dotnet publish src/Budget.Server --configuration Release --output artifacts/server

      - name: Create a development HTTPS certificate
        run: dotnet dev-certs https

      - name: Start the app
        working-directory: artifacts/server
        env:
          ASPNETCORE_ENVIRONMENT: Testing
          TestSignIn__Enabled: "true"
          Database__MigrateOnStartup: "true"
          ConnectionStrings__Budget: "Server=localhost,1433;Database=HomeBudgetE2E;User Id=sa;Password=E2e_Only_Pa55!;TrustServerCertificate=True;Encrypt=False"
        run: |
          nohup dotnet Budget.Server.dll --urls "$E2E_BASE_URL" > ../server.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -skf "$E2E_BASE_URL/health" > /dev/null; then echo "App is up"; exit 0; fi
            sleep 2
          done
          echo "The app didn't start"; cat ../server.log; exit 1

      - name: Check the app serves its pages
        run: |
          curl -sk -o /dev/null -w "/ -> %{http_code}\n" "$E2E_BASE_URL/"
          curl -sk -o /dev/null -w "/login -> %{http_code}\n" "$E2E_BASE_URL/login"
          curl -sk -o /dev/null -w "/manifest.webmanifest -> %{http_code} %{content_type}\n" "$E2E_BASE_URL/manifest.webmanifest"
          curl -sk -o /dev/null -w "/service-worker.js -> %{http_code}\n" "$E2E_BASE_URL/service-worker.js"
          curl -sk -o /dev/null -w "/account/test-sign-in -> %{http_code}\n" "$E2E_BASE_URL/account/test-sign-in?name=Probe"
          curl -sk "$E2E_BASE_URL/" | head -c 3000

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install Playwright
        working-directory: tests/e2e
        run: |
          # Exactly the versions in package-lock.json (BUD-160).
          npm ci --no-audit --no-fund
          npx playwright install chromium
          # The system packages come from Ubuntu's mirrors, which are sometimes unreachable from GitHub's runners, and
          # apt can spend many minutes failing. Try twice, a few minutes each; if they still can't be fetched, carry on:
          # the runner image already has what headless Chromium needs, and what's missing is mostly extra fonts.
          for attempt in 1 2; do
            if timeout 240 sudo npx playwright install-deps chromium; then exit 0; fi
            echo "Installing system packages failed or timed out (attempt $attempt)"
            sleep 15
          done
          echo "::warning::Couldn't install Playwright's system packages; using what the runner already has"

      - name: Run end-to-end tests
        working-directory: tests/e2e
        env:
          PRINT_SCREENS: ${{ inputs.print_screens == true }}
        run: npx playwright test

      - name: Show the app's log
        if: failure()
        run: tail -n 200 artifacts/server.log

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
            artifacts/server.log

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-screens
          path: tests/e2e/screens

  # Security scan (BUD-145, OWASP review BUD-74): run the published app as for the end-to-end tests, sign in with the
  # test sign-in, and let the ZAP baseline scan crawl it (with a browser, so the Blazor pages and their API calls are
  # seen). The baseline scan is passive: it reads responses and doesn't attack the app. It fails on medium or high
  # alerts that aren't accepted in tests/security/zap-accepted.tsv.
  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      sql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "E2e_Only_Pa55!"
          MSSQL_PID: Developer
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'E2e_Only_Pa55!' -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_URL: https://localhost:7180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Publish the app
        run: dotnet publish src/Budget.Server --configuration Release --output artifacts/server

      - name: Create a development HTTPS certificate
        run: dotnet dev-certs https

      - name: Start the app
        working-directory: artifacts/server
        env:
          ASPNETCORE_ENVIRONMENT: Testing
          TestSignIn__Enabled: "true"
          Database__MigrateOnStartup: "true"
          ConnectionStrings__Budget: "Server=localhost,1433;Database=HomeBudgetZap;User Id=sa;Password=E2e_Only_Pa55!;TrustServerCertificate=True;Encrypt=False"
          # Log each request, so the job can check the scan reached the API and not only the app's files.
          Logging__LogLevel__Microsoft.AspNetCore.Hosting.Diagnostics: Information
        run: |
          nohup dotnet Budget.Server.dll --urls "$APP_URL" > ../server.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -skf "$APP_URL/health" > /dev/null; then echo "App is up"; exit 0; fi
            sleep 2
          done
          echo "The app didn't start"; cat ../server.log; exit 1

      - name: Sign in with the test sign-in
        id: sign-in
        run: |
          curl -sk -o /dev/null -c cookies.txt "$APP_URL/account/test-sign-in?name=Zap%20Scanner&returnUrl=%2F"
          cookie=$(awk '$6 == "__Host-budget" { print $7 }' cookies.txt)
          if [ -z "$cookie" ]; then echo "Signing in didn't give a cookie"; cat cookies.txt; exit 1; fi
          echo "::add-mask::$cookie"
          echo "cookie=$cookie" >> "$GITHUB_OUTPUT"

      - name: Run the ZAP baseline scan
        env:
          SESSION_COOKIE: ${{ steps.sign-in.outputs.cookie }}
          SCAN_URL: https://budget.test:7180
        run: |
          mkdir -p zap && chmod 777 zap
          # Every request ZAP makes carries the signed-in cookie, so it sees the pages and API as a member would.
          # -j crawls with a browser as well; -I leaves deciding pass or fail to check-zap-report.py.
          # Scanned as budget.test rather than localhost: the app (like browsers) treats localhost as a special case and
          # leaves out Strict-Transport-Security there, so a real host name shows the headers a deployed app sends.
          docker run --rm --network host --add-host budget.test:127.0.0.1 -v "$PWD/zap:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t "$SCAN_URL" -j -m 3 -I -J report.json -r report.html \
            -z "-config replacer.full_list(0).description=signed-in \
                -config replacer.full_list(0).enabled=true \
                -config replacer.full_list(0).matchtype=REQ_HEADER \
                -config replacer.full_list(0).matchstr=Cookie \
                -config replacer.full_list(0).regex=false \
                -config replacer.full_list(0).replacement=__Host-budget=$SESSION_COOKIE \
                -config ajaxSpider.maxDuration=3"

      - name: Check the scan reached the API signed in
        run: |
          # Ids are replaced, so the list shows which endpoints were scanned rather than every household.
          grep -oE "Request starting HTTP/[0-9.]+ [A-Z]+ https://[^/ ]+/(api|bff)/[^ ]*" artifacts/server.log \
            | sed -E 's#https://[^/]+##; s#[0-9a-f]{8}-[0-9a-f-]{27}#{id}#g; s#\?.*##' | sort | uniq -c | sort -rn > zap/api-requests.txt || true
          echo "API endpoints the scan requested:"; cat zap/api-requests.txt
          if ! grep -q "/api/households/" zap/api-requests.txt; then
            echo "::error::The scan didn't reach the household API, so it probably wasn't signed in."
            exit 1
          fi

      - name: Check the alerts
        if: success() || failure()
        run: python3 tests/security/check-zap-report.py zap/report.json tests/security/zap-accepted.tsv

      - name: Show the app's log
        if: failure()
        run: tail -n 100 artifacts/server.log

      - name: Upload the ZAP report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zap-report
          path: |
            zap/report.html
            zap/report.json
            zap/api-requests.txt
